name: Android helper

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-helper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release from main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk slow-week-helper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slow-week-helper
          path: slow-week-helper.apk

      # Builds from main replace the "helper" release, so its download link never changes.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete helper --yes --cleanup-tag || true
          gh release create helper slow-week-helper.apk \
            --target "$GITHUB_SHA" \
            --title "Slow Week helper for Android (build ${{ github.run_number }})" \
            --notes "Install slow-week-helper.apk on your Android phone. See the README for setup."
